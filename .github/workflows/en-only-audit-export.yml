name: EN-only migration pipeline

on:
  push:
    branches:
      - refactor/en-only-remove-cn-jp-tw
    paths:
      - .github/workflows/en-only-audit-export.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/en-only-audit-export.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: en-only-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/en-only-remove-cn-jp-tw
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Restore verified migration tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/en_only_tools.b64
          for sha in \
            a97fc9bd971c1b6861d502648068b211e07ef26b \
            ee76694301f78b6e8d09e76cb16ec9943f620ed5 \
            33ad2761a7f5ba1feaa8db823df1cb293b165921 \
            00e899bfc58c0221586bc180b7ec04f81035f68d \
            064da0dbd6b4a8aa49bf547725d069171d6a6b2d \
            f79d5ceeff19fe55233d757e09d04c6c45159c0b
          do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 --decode >> /tmp/en_only_tools.b64
          done
          base64 --decode /tmp/en_only_tools.b64 > /tmp/en_only_tools.tar.gz
          echo "4284c5b16a67ea520ed56877c4f76a49798faea95a52882063e4c4ed870da955  /tmp/en_only_tools.tar.gz" | sha256sum --check
          tar -xzf /tmp/en_only_tools.tar.gz -C .

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/65aabb48fcf4de482430ea279dfce192850b04ea" \
            | jq -r '.content' | tr -d '\n' | base64 --decode > /tmp/azurstats_patch.b64
          base64 --decode /tmp/azurstats_patch.b64 > /tmp/azurstats_patch.gz
          echo "2417e6a2724de3dd8ef868a4144d9d294a974be3dfd6e4670207ed110bfd7059  /tmp/azurstats_patch.gz" | sha256sum --check
          gzip -dc /tmp/azurstats_patch.gz > /tmp/azurstats_tools.patch
          git apply /tmp/azurstats_tools.patch

          printf '%s\n' \
            dev_tools/en_only_migration.py \
            dev_tools/en_only_data_cleanup.py >> .git/info/exclude
          python -m py_compile dev_tools/en_only_migration.py dev_tools/en_only_data_cleanup.py

      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libgbm1 libnss3 libasound2
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy<2' 'scipy<2' pillow opencv-python-headless imageio \
            pyyaml cached-property tqdm requests lxml psutil retrying rich \
            inflection 'pydantic<2' aiofiles prettytable 'anyio<4' pycryptodome pyzmq

      - name: Configure Git and capture baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p _en_only_audit
          git status --short > _en_only_audit/git-status.txt
          git rev-parse origin/master > _en_only_audit/fork-head.txt
          git ls-remote https://github.com/LmeSzinc/AzurLaneAutoScript.git refs/heads/master | awk '{print $1}' > _en_only_audit/upstream-head.txt
          python --version > _en_only_audit/python-version.txt 2>&1
          node --version > _en_only_audit/node-version.txt 2>&1
          npm --version > _en_only_audit/npm-version.txt 2>&1
          (pnpm --version || true) > _en_only_audit/pnpm-version.txt 2>&1
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort > _en_only_audit/active-workflows.txt
          printf '%s\n' \
            'python -m compileall -q alas.py gui.py module deploy dev_tools campaign submodule' \
            'python -m unittest discover -s tests -v' > _en_only_audit/test-commands.txt
          printf '%s\n' \
            'python -m module.config.config_updater' \
            'cd webapp && npm run build' > _en_only_audit/generation-build-commands.txt

          set +e
          python -m compileall -q alas.py gui.py module deploy dev_tools campaign submodule > _en_only_audit/baseline-compile.log 2>&1
          echo $? > _en_only_audit/baseline-compile.exit
          set -e

      - name: Capture baseline webapp checks
        working-directory: webapp
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false --ignore-scripts
          set +e
          npm run lint > ../_en_only_audit/baseline-webapp-lint.log 2>&1; echo $? > ../_en_only_audit/baseline-webapp-lint.exit
          npm run typecheck > ../_en_only_audit/baseline-webapp-typecheck.log 2>&1; echo $? > ../_en_only_audit/baseline-webapp-typecheck.exit
          xvfb-run -a npm run test > ../_en_only_audit/baseline-webapp-test.log 2>&1; echo $? > ../_en_only_audit/baseline-webapp-test.exit
          npm run build > ../_en_only_audit/baseline-webapp-build.log 2>&1; echo $? > ../_en_only_audit/baseline-webapp-build.exit
          set -e

      - name: Commit staged EN-only migration
        shell: bash
        run: |
          set -euo pipefail
          commit_phase() {
            local phase="$1"
            local message="$2"
            python dev_tools/en_only_migration.py "$phase"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "$message"
            fi
          }

          commit_phase audit 'docs(audit): inventory EN-only removal scope'
          commit_phase docs 'docs: make English README canonical'
          commit_phase config 'refactor(config): restrict generated configuration to EN'
          commit_phase runtime 'refactor(runtime): remove CN JP TW server dispatch'
          commit_phase azurstats 'refactor(statistics): remove AzurStats integration'
          commit_phase assets 'refactor(assets): migrate templates to EN-only tree'
          commit_phase gui 'refactor(gui): remove localized UI surfaces'
          commit_phase regenerate 'chore(generate): regenerate EN-only configuration and assets'
          commit_phase tests 'test: add EN-only package config and AzurStats coverage'
          commit_phase cleanup 'refactor(cleanup): remove residual localization and document exceptions'
          commit_phase regenerate 'chore(generate): verify generated outputs after cleanup'

      - name: Run core validation and commit report
        shell: bash
        run: |
          set -euo pipefail
          mv webapp/node_modules /tmp/webapp-node_modules
          python dev_tools/en_only_migration.py validate
          mv /tmp/webapp-node_modules webapp/node_modules
          git diff --check
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'test: validate EN-only migration core'
          fi

      - name: Compare post-migration webapp checks with baseline
        working-directory: webapp
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run lint > ../_en_only_audit/post-webapp-lint.log 2>&1; echo $? > ../_en_only_audit/post-webapp-lint.exit
          npm run typecheck > ../_en_only_audit/post-webapp-typecheck.log 2>&1; echo $? > ../_en_only_audit/post-webapp-typecheck.exit
          xvfb-run -a npm run test > ../_en_only_audit/post-webapp-test.log 2>&1; echo $? > ../_en_only_audit/post-webapp-test.exit
          npm run build > ../_en_only_audit/post-webapp-build.log 2>&1; echo $? > ../_en_only_audit/post-webapp-build.exit
          set -e

          for check in lint typecheck test build; do
            before=$(cat "../_en_only_audit/baseline-webapp-${check}.exit")
            after=$(cat "../_en_only_audit/post-webapp-${check}.exit")
            if [ "$before" = "0" ] && [ "$after" != "0" ]; then
              echo "Webapp regression in ${check}: baseline=${before}, post=${after}" >&2
              exit 1
            fi
          done

      - name: Finalize validation report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo '## Webapp baseline comparison'
            echo
            echo '| Check | Baseline exit | Post-migration exit | Classification |'
            echo '|---|---:|---:|---|'
            for check in lint typecheck test build; do
              before=$(cat "_en_only_audit/baseline-webapp-${check}.exit")
              after=$(cat "_en_only_audit/post-webapp-${check}.exit")
              if [ "$after" = "0" ]; then
                result='PASS'
              elif [ "$before" = "$after" ]; then
                result='BASELINE FAILURE (not introduced by migration)'
              else
                result='CHANGED FAILURE'
              fi
              echo "| ${check} | ${before} | ${after} | ${result} |"
            done
            echo
            echo 'Exact stdout/stderr is retained in `_en_only_audit/baseline-webapp-*.log` and `_en_only_audit/post-webapp-*.log`.'
          } >> EN_ONLY_VALIDATION_REPORT.md

          git add -A
          git commit -m 'docs: record final EN-only validation and baseline comparison'
          test "$(git status --porcelain --untracked-files=no)" = ""

      - name: Push migration commits
        shell: bash
        run: |
          set -euo pipefail
          rm -f dev_tools/en_only_migration.py dev_tools/en_only_data_cleanup.py
          git push origin HEAD:refactor/en-only-remove-cn-jp-tw
